<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#020408"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#0ff1ff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="url(#bgGrad)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <g stroke="#ffb000" stroke-width="2" fill="none" opacity="0.85">
    <path d="M30,30 L30,70 M30,30 L70,30"/>
    <path d="M1170,30 L1170,70 M1170,30 L1130,30"/>
    <path d="M30,290 L30,250 M30,290 L70,290"/>
    <path d="M1170,290 L1170,250 M1170,290 L1130,290"/>
  </g>

  <g transform="translate(600,150)">
    <circle r="140" fill="none" stroke="#00e5ff" stroke-width="1" stroke-dasharray="3 8" opacity="0.5">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="26s" repeatCount="indefinite"/>
    </circle>
    <circle r="112" fill="none" stroke="#00e5ff" stroke-width="1" stroke-dasharray="1 4" opacity="0.35">
      <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle r="88" fill="none" stroke="#ffb000" stroke-width="1.2" opacity="0.4">
      <animate attributeName="r" values="88;94;88" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.15;0.4" dur="4s" repeatCount="indefinite"/>
    </circle>

    <circle r="4" fill="#ffb000" filter="url(#glow)">
      <animateMotion dur="9s" repeatCount="indefinite" path="M140,0 A140,140 0 1,1 -140,0 A140,140 0 1,1 140,0"/>
    </circle>
    <circle r="3" fill="#00e5ff" filter="url(#glow)">
      <animateMotion dur="13s" repeatCount="indefinite" path="M-112,0 A112,112 0 1,0 112,0 A112,112 0 1,0 -112,0"/>
    </circle>
  </g>

  <text x="600" y="165" text-anchor="middle" font-family="'Courier New', monospace" font-size="64" font-weight="700" fill="#00e5ff" filter="url(#glow)" letter-spacing="6">
    YUGAL
    <animate attributeName="opacity" values="1;0.82;1" dur="3.2s" repeatCount="indefinite"/>
  </text>

  <text x="600" y="205" text-anchor="middle" font-family="'Courier New', monospace" font-size="18" fill="#ffb000" letter-spacing="8" opacity="0">
    AGENTIC AI ENGINEER
    <animate attributeName="opacity" from="0" to="1" dur="1.5s" begin="0.6s" fill="freeze"/>
  </text>

  <rect x="0" y="0" width="1200" height="2" fill="#00e5ff" opacity="0.25">
    <animate attributeName="y" values="0;320;0" dur="6s" repeatCount="indefinite"/>
  </rect>

  <g font-family="'Courier New', monospace" font-size="12" fill="#00e5ff" opacity="0.75">
    <text x="90" y="120">SYS.CORE :: ONLINE</text>
    <text x="90" y="140">MODE :: BUILD</text>
    <circle cx="80" cy="116" r="3" fill="#00e5ff">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="1110" y="120" text-anchor="end">LOC :: PUNE, IN</text>
    <text x="1110" y="140" text-anchor="end">TARGET :: EU RELOCATION</text>
  </g>
</svg>
